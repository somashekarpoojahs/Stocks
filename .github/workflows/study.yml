# Exit study: compares ways of exiting on years of data and saves the write-up into
# research/. Run it from Actions > exit-study > Run workflow. "entry" picks the buy rule:
# score (the scanner's signals), restart (Supertrend 7,3 trend restarts), st7_flip (every
# Supertrend 7,3 flip up), or several separated by commas.
name: exit-study

on:
  workflow_dispatch:
    inputs:
      period:
        description: "History to test (e.g. 5y, 10y)"
        default: "5y"
      universe:
        description: "Universe (sp1500, sp500, nasdaq100 ...)"
        default: "sp1500"
      threshold:
        description: "Minimum score for a signal"
        default: "70"
      entry:
        description: "Entry rule(s): score, restart, st7_flip (comma-separated)"
        default: "score"

permissions:
  contents: write

concurrency:
  group: exit-study
  cancel-in-progress: false

jobs:
  study:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      PERIOD: ${{ inputs.period }}
      UNIVERSE: ${{ inputs.universe }}
      THRESHOLD: ${{ inputs.threshold }}
      ENTRY: ${{ inputs.entry }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
      - name: Install
        run: pip install -r requirements.txt
      - name: Run the study
        run: python -m smart_scanner study --universe "$UNIVERSE" --period "$PERIOD" --threshold "$THRESHOLD" --entry "$ENTRY" --out research
      - name: Save results into research/
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add research
          if git diff --cached --quiet; then echo "No changes to save"; exit 0; fi
          git commit -m "Study $(date -u +%F): $ENTRY ($PERIOD, $UNIVERSE)"
          git pull --rebase origin "$GITHUB_REF_NAME"
          git push origin "HEAD:$GITHUB_REF_NAME"
