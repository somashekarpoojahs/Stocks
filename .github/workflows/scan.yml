# Daily scan: every US trading evening after the close, plus a morning re-run as a backup
# (GitHub sometimes starts scheduled jobs hours late). It scans the last complete day: a
# bar that is still forming is left out. The report is saved into scans/ in this repo.
#
# Your own numbers come from repository variables
# (Settings > Secrets and variables > Actions > Variables):
#   ACCOUNT_SIZE (e.g. 500), CCY_PER_USD (0.89 if you size in EUR), RISK (0.02),
#   FEES (ibkr-fixed | ibkr-tiered | none), UNIVERSE (sp1500 | sp500 | nasdaq100 | ...)
name: daily-scan

on:
  schedule:
    # GitHub often starts scheduled runs hours late. Runs that slipped to ~00:10 UTC got Yahoo
    # data missing the day just closed (22 and 23 Oct 2026), so the main runs are in the
    # morning, on odd minutes (the top of the hour is GitHub's busiest time). A run whose data
    # is older than the saved report never replaces it.
    - cron: "41 21 * * 1-5"   # 21:41 UTC Mon-Fri, after the US close, when it starts on time
    - cron: "23 4 * * 2-6"    # 04:23 UTC Tue-Sat
    - cron: "47 8 * * 2-6"    # 08:47 UTC Tue-Sat, still well before the 12:15 UTC order prep
  workflow_dispatch:          # "Run workflow" button

permissions:
  contents: write             # needed to commit the report into scans/

concurrency:
  group: daily-scan
  cancel-in-progress: false

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      SCANNER_ACCOUNT: ${{ vars.ACCOUNT_SIZE }}
      SCANNER_CCY_PER_USD: ${{ vars.CCY_PER_USD }}
      SCANNER_RISK: ${{ vars.RISK }}
      SCANNER_FEES: ${{ vars.FEES }}
      SCANNER_UNIVERSE: ${{ vars.UNIVERSE }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip

      - name: Install
        run: pip install -r requirements.txt

      - name: Test
        run: python -m pytest -q

      - name: Scan the market
        run: python -m smart_scanner scan --with-backtest --out reports

      - name: Save the report into scans/
        run: |
          day=$(ls reports/scan_*.md | sed -E 's#.*/scan_(.*)\.md#\1#' | sort | tail -1)
          # Never replace a report with an older one. A run that GitHub starts late in the US
          # evening can get Yahoo data that is missing the day just closed (it happened on
          # 22 Oct 2026: 1,492 of 1,496 stocks ended a day early).
          saved=$(sed -nE 's/^Data as of ([0-9-]+).*/\1/p' scans/latest.md 2>/dev/null | head -1)
          if [ -n "$saved" ] && [[ "$day" < "$saved" ]]; then
            echo "::warning::This run's data ends on $day, before the saved report ($saved). Keeping the saved report."
            exit 0
          fi
          mkdir -p "scans/$day"
          cp reports/*"$day"* "scans/$day/"
          cp "reports/scan_$day.md" scans/latest.md
          cp "reports/scan_$day.html" scans/latest.html
          for f in longs watch shorts restarts restart_watch; do
            if [ -f "reports/${f}_$day.csv" ]; then cp "reports/${f}_$day.csv" "scans/latest_$f.csv"
            else rm -f "scans/latest_$f.csv"; fi
          done
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add scans
          if git diff --cached --quiet; then echo "No changes to save"; exit 0; fi
          git commit -m "Scan for $day"
          git pull --rebase origin "$GITHUB_REF_NAME"
          git push origin "HEAD:$GITHUB_REF_NAME"

      - name: Keep a copy as a run artifact
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: scan-report
          path: reports/
          retention-days: 30
